<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Route Not Found | Tekno Krafft 2026</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #08090D;
        color: #F4F5FA;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background-color: #141824;
        border: 1px solid #28314B;
        border-radius: 8px;
        padding: 48px;
        max-width: 560px;
        width: 100%;
        text-align: center;
      }
      .tag {
        display: inline-block;
        font-family: monospace;
        font-size: 12px;
        color: #4DEBFF;
        background: #10131D;
        border: 1px solid #28314B;
        padding: 4px 10px;
        border-radius: 4px;
        margin-bottom: 20px;
        letter-spacing: 1px;
      }
      h1 {
        font-size: 48px;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 12px;
        color: #F4F5FA;
      }
      p {
        color: #9298AA;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-block;
        background-color: #4DEBFF;
        color: #08090D;
        font-weight: 700;
        font-size: 13px;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 6px;
        letter-spacing: 0.5px;
        transition: opacity 0.15s ease;
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="tag">404 // ROUTE DISCONNECTED</span>
      <h1>SIGNAL LOST</h1>
      <p>
        The requested technical route does not exist or has been relocated within the Tekno Krafft 2026 infrastructure ledger.
      </p>
      <a href="/" class="btn">RETURN TO MISSION CONTROL</a>
    </div>
  </body>
</html>
